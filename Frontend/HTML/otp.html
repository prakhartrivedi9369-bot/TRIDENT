<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Secure OTP Verification</title>

<style>
:root{
  --bg:#0b0f14;
  --bg2:#111826;
  --card:#121b28;
  --text:#e7f0ff;
  --muted:#93a4c2;
  --accent:#19e68c;
  --accent-dark:#0db16a;
  --danger:#ff4d6d;
  --success:#2ee6a6;
  --border:rgba(255,255,255,0.08);
  --shadow:0 10px 40px rgba(0,0,0,0.4);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:
    radial-gradient(circle at top left,#1b2d48 0%,transparent 35%),
    radial-gradient(circle at bottom right,#1a2a22 0%,transparent 35%),
    linear-gradient(180deg,var(--bg2),var(--bg));
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  overflow:hidden;
}

/* Animated background */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,0.03) 1px,transparent 1px);
  background-size:40px 40px;
  animation:gridMove 18s linear infinite;
  pointer-events:none;
}

@keyframes gridMove{
  from{transform:translate(0,0);}
  to{transform:translate(40px,40px);}
}

.card{
  width:100%;
  max-width:450px;
  background:rgba(18,27,40,0.95);
  border:1px solid var(--border);
  border-radius:20px;
  padding:30px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(10px);
  position:relative;
  overflow:hidden;
}

.card::before{
  content:"";
  position:absolute;
  width:300px;
  height:300px;
  background:radial-gradient(circle,var(--accent) 0%,transparent 70%);
  top:-150px;
  right:-150px;
  opacity:.08;
}

.logo{
  width:60px;
  height:60px;
  margin:auto;
  border-radius:50%;
  background:linear-gradient(135deg,var(--accent),#00ffbf);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:28px;
  font-weight:bold;
  color:#04140d;
  box-shadow:0 0 20px rgba(25,230,140,0.4);
}

h1{
  margin-top:20px;
  text-align:center;
  font-size:28px;
}

.subtitle{
  margin-top:12px;
  text-align:center;
  color:var(--muted);
  line-height:1.5;
  font-size:14px;
}

.otp-group{
  display:flex;
  justify-content:center;
  gap:12px;
  margin-top:30px;
}

.otp-input{
  width:52px;
  height:60px;
  border-radius:12px;
  border:1px solid var(--border);
  background:#0f1722;
  color:var(--text);
  text-align:center;
  font-size:24px;
  font-weight:bold;
  outline:none;
  transition:0.2s;
  appearance:textfield;
}

.otp-input::-webkit-inner-spin-button,
.otp-input::-webkit-outer-spin-button{
  -webkit-appearance:none;
  margin:0;
}

.otp-input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 4px rgba(25,230,140,0.15);
  transform:translateY(-2px);
}

.otp-input.error{
  border-color:var(--danger);
  animation:shake 0.3s;
}

@keyframes shake{
  0%{transform:translateX(0);}
  25%{transform:translateX(-4px);}
  50%{transform:translateX(4px);}
  75%{transform:translateX(-2px);}
  100%{transform:translateX(0);}
}

.options{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:18px;
  flex-wrap:wrap;
  gap:10px;
}

.toggle-btn,
.resend-btn{
  background:none;
  border:none;
  color:#9cc6ff;
  cursor:pointer;
  font-size:14px;
}

.toggle-btn:hover,
.resend-btn:hover{
  text-decoration:underline;
}

.verify-btn{
  width:100%;
  margin-top:24px;
  height:52px;
  border:none;
  border-radius:14px;
  background:linear-gradient(180deg,var(--accent),var(--accent-dark));
  color:#042215;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  transition:0.2s;
  box-shadow:0 10px 25px rgba(25,230,140,0.25);
}

.verify-btn:hover{
  transform:translateY(-2px);
}

.verify-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.status{
  min-height:22px;
  margin-top:18px;
  text-align:center;
  font-size:14px;
}

.status.error{
  color:var(--danger);
}

.status.success{
  color:var(--success);
}

.status.loading{
  color:#8ec8ff;
}

.footer{
  margin-top:24px;
  text-align:center;
  color:var(--muted);
  font-size:12px;
  line-height:1.6;
}

@media(max-width:480px){
  .card{
    margin:15px;
    padding:25px 20px;
  }

  .otp-group{
    gap:8px;
  }

  .otp-input{
    width:45px;
    height:55px;
    font-size:22px;
  }

  .options{
    flex-direction:column;
    align-items:flex-start;
  }
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">✓</div>

  <h1>OTP Verification</h1>

  <p class="subtitle">
    Enter the 6-digit verification code sent to your mobile/email ending in ••73
  </p>

  <form id="otpForm">

    <div class="otp-group">
      <input type="text" class="otp-input" maxlength="1" inputmode="numeric" required>
      <input type="text" class="otp-input" maxlength="1" inputmode="numeric" required>
      <input type="text" class="otp-input" maxlength="1" inputmode="numeric" required>
      <input type="text" class="otp-input" maxlength="1" inputmode="numeric" required>
      <input type="text" class="otp-input" maxlength="1" inputmode="numeric" required>
      <input type="text" class="otp-input" maxlength="1" inputmode="numeric" required>
    </div>

    <div class="options">
      <button type="button" class="toggle-btn" id="toggleBtn">
        Hide Digits
      </button>

      <button type="button" class="resend-btn" id="resendBtn">
        Resend Code (30s)
      </button>
    </div>

    <button type="submit" class="verify-btn" id="verifyBtn">
      Verify Code
    </button>

    <div class="status" id="status"></div>

  </form>

  <div class="footer">
    Secure verification using encrypted connection.<br>
    Too many failed attempts may temporarily lock verification.
  </div>

</div>

<script>

const inputs = document.querySelectorAll(".otp-input");
const form = document.getElementById("otpForm");
const statusEl = document.getElementById("status");
const verifyBtn = document.getElementById("verifyBtn");
const resendBtn = document.getElementById("resendBtn");
const toggleBtn = document.getElementById("toggleBtn");

let hidden = false;
let attempts = 0;

/* FRONTEND-ONLY SEND LIMITING CONFIG */
const MAX_SEND_ATTEMPTS = 3;
const COOLDOWN_SECONDS = 60;

const SEND_COUNT_KEY = "otp_send_count";
const LAST_SEND_TIME_KEY = "otp_last_send_time";

/* ===========================
   OTP INPUT HANDLING
=========================== */

inputs.forEach((input, index) => {

    input.addEventListener("input", () => {

        input.value = input.value.replace(/\D/g, "");

        if (input.value && index < inputs.length - 1) {
            inputs[index + 1].focus();
        }

        input.classList.remove("error");
        clearStatus();
    });

    input.addEventListener("keydown", (e) => {

        if (e.key === "Backspace" && !input.value && index > 0) {
            inputs[index - 1].focus();
        }

        if (e.key === "ArrowLeft" && index > 0) {
            inputs[index - 1].focus();
        }

        if (e.key === "ArrowRight" && index < inputs.length - 1) {
            inputs[index + 1].focus();
        }
    });

    input.addEventListener("paste", (e) => {

        e.preventDefault();

        const pasted = (e.clipboardData || window.clipboardData)
            .getData("text")
            .replace(/\D/g, "")
            .slice(0, 6);

        pasted.split("").forEach((digit, i) => {
            if (inputs[i]) {
                inputs[i].value = digit;
            }
        });

        if (pasted.length < inputs.length) {
            inputs[pasted.length].focus();
        } else {
            inputs[inputs.length - 1].focus();
        }

    });

});

/* ===========================
   SHOW / HIDE OTP
=========================== */

toggleBtn.addEventListener("click", () => {

    hidden = !hidden;

    inputs.forEach(input => {
        input.type = hidden ? "password" : "text";
    });

    toggleBtn.textContent = hidden ? "Show Digits" : "Hide Digits";

});

/* ===========================
   SEND LIMIT HELPERS
=========================== */

function getSendCount() {
    return parseInt(sessionStorage.getItem(SEND_COUNT_KEY) || "0", 10);
}

function incrementSendCount() {

    const count = getSendCount() + 1;
    sessionStorage.setItem(SEND_COUNT_KEY, String(count));
    return count;

}

function hasReachedMaxAttempts() {
    return getSendCount() >= MAX_SEND_ATTEMPTS;
}

function markOtpSent() {
    sessionStorage.setItem(LAST_SEND_TIME_KEY, String(Date.now()));
}

function getRemainingCooldown() {

    const lastSend = parseInt(sessionStorage.getItem(LAST_SEND_TIME_KEY) || "0", 10);

    if (!lastSend) return 0;

    const elapsed = Math.floor((Date.now() - lastSend) / 1000);

    return Math.max(0, COOLDOWN_SECONDS - elapsed);

}

function lockResendPermanently(message) {

    resendBtn.disabled = true;
    resendBtn.textContent = "Resend Unavailable";

    showStatus(
        message || "Maximum resend attempts reached.",
        "error"
    );

}

/* ===========================
   VERIFY OTP
=========================== */

form.addEventListener("submit", async (e) => {

    e.preventDefault();

    const code = [...inputs].map(i => i.value).join("");
    const email = localStorage.getItem("userEmail");

    if (code.length !== 6) {

        showStatus("Please enter all 6 digits.", "error");

        inputs.forEach(input => {
            if (!input.value)
                input.classList.add("error");
        });

        return;
    }

    verifyBtn.disabled = true;

    showStatus("Verifying code...", "loading");

    await wait(1500);

    try {

        const response = await fetch("/verify-otp", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                email: email,
                otp: code

            }),
            credentials: 'include'
        });

        const result = await response.json();

        alert(result.message);

        if (result.success)
        {
            if(result.usecase == "FORGET_PASSWORD")
            {
               verifyBtn.disabled = false;

               sessionStorage.setItem("reset_token",result.reset_token);

               window.location.href = "/Pass_reset";

               return;
            }

            if(result.usecase == "LOGIN")
            {
                verifyBtn.disabled = false;

                const response2 = await fetch("/JWT_check", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    email: email
                }),
                    credentials: 'include'
                });

                const result2 = await response2.json();

                if(result2.success)
                {            
                    window.location.href = "/Front_page";
                }
                else
                {
                    alert(result2.message);
                }
            }

            if(result.usecase == "SIGNUP")
            {
                verifyBtn.disabled = false;

                const response2 = await fetch("/JWT_check", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    email: email
                }),
                    credentials: 'include'
                });

                const result2 = await response2.json();

                if(result2.success)
                {            
                    window.location.href = "/Front_page";
                }
                else
                {
                    alert(result2.message);
                }
            }
        }

        if (result.code === "WRONG_OTP") {
            alert("Wrong OTP");
        }

        if (result.code === "OTP_EXPIRED") {

            alert("OTP expired");

            if (!hasReachedMaxAttempts()) {

                resendBtn.disabled = false;
                resendBtn.textContent = "Resend Code";

            } else {

                lockResendPermanently();

            }
        }

        if (result.code === "REDIS_ERROR") {
            alert("Internal Server Error");
        }

        attempts++;

        inputs.forEach(input => {
            input.classList.add("error");
        });

        if (attempts >= 3) {

            showStatus(
                "Too many failed attempts. Please wait 60 seconds.",
                "error"
            );

            startCooldown(COOLDOWN_SECONDS);

            attempts = 0;
        }

    }
    catch (err) {

        console.error(err);

        showStatus(
            "Something went wrong.",
            "error"
        );

    }
    finally {

        verifyBtn.disabled = false;

    }

});

/* ===========================
   COMMON HELPERS
=========================== */

function showStatus(message, type) {

    statusEl.className = "status";

    if (type)
        statusEl.classList.add(type);

    statusEl.textContent = message;

}

function clearStatus() {

    statusEl.textContent = "";
    statusEl.className = "status";

}

function wait(ms) {

    return new Promise(resolve => setTimeout(resolve, ms));

}
/* ===========================
   RESEND COOLDOWN
=========================== */

function startCooldown(seconds) {

    let remaining = seconds;

    resendBtn.disabled = true;
    resendBtn.textContent = `Resend Code (${remaining}s)`;

    const timer = setInterval(() => {

        remaining--;

        if (remaining <= 0) {

            clearInterval(timer);

            if (hasReachedMaxAttempts()) {

                lockResendPermanently();

            } else {

                resendBtn.disabled = false;
                resendBtn.textContent = "Resend Code";

            }

            return;
        }

        resendBtn.textContent = `Resend Code (${remaining}s)`;

    }, 1000);

}

/* ===========================
   RESEND OTP
=========================== */

resendBtn.addEventListener("click", async () => {

    if (hasReachedMaxAttempts()) {
        lockResendPermanently();
        return;
    }

    const email = localStorage.getItem("userEmail");
    const usecase = sessionStorage.getItem("usecase");

    if (!email || !usecase) {
        showStatus("Session expired. Please restart the process.", "error");
        return;
    }

    startCooldown(COOLDOWN_SECONDS);

    inputs.forEach(input => {
        input.value = "";
        input.classList.remove("error");
    });

    inputs[0].focus();

    showStatus("Sending new verification code...", "loading");

    try {

        const response = await fetch("/send-otp", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                email: email,
                usecase: usecase

            })

        });

        const result = await response.json();

        if (result.success) {

            alert(result.message);

            clearStatus();

            markOtpSent();

            const count = incrementSendCount();

            if (count >= MAX_SEND_ATTEMPTS) {
                // Current cooldown finish hone ke baad
                // button permanently disable ho jayega.
            }

        }
        else {

            showStatus(result.message, "error");

        }

    }
    catch (err) {

        console.error(err);

        showStatus(
            "Error connecting to server.",
            "error"
        );

    }

});

/* ===========================
   PAGE LOAD
=========================== */

window.addEventListener("load", () => {

    inputs[0].focus();

    if (hasReachedMaxAttempts()) {

        lockResendPermanently();
        return;

    }

    const remaining = getRemainingCooldown();

    if (remaining > 0) {

        startCooldown(remaining);

    } else {

        resendBtn.disabled = false;
        resendBtn.textContent = "Resend Code";

    }

});

</script>

</body>
</html>
