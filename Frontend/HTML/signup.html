<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRIDENT | Next-Gen Stock Exchange</title>
    <link rel="stylesheet" href="/signup.css">

</head>
<body>

    <div class="bg-grid"></div>
    <div class="glow-orb"></div>
    <div class="glow-orb-2"></div>

    <div class="signup-container">
        <div class="header">
            <div class="logo">APEXTRADE</div>
            <div class="subtitle">Create your institutional-grade trading account</div>
        </div>

        <form id="signupForm" autocomplete="off">
            <div class="form-group">
                <label for="username">Full Name</label>
                <div class="input-wrapper">
                    <input type="text" id="username" required placeholder="John Doe">
                    <div class="input-bar"></div>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-wrapper">
                    <input type="email" id="email" required placeholder="name@exchange.com">
                    <div class="input-bar"></div>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" required placeholder="••••••••">
                    <div class="input-bar"></div>
                </div>
                <div class="password-strength" id="strengthMeter">
                    <div class="strength-bar" id="strengthBar"></div>
                </div>
            </div>

            <label class="terms-container">
                <input type="checkbox" required>
                <span>I acknowledge the risk disclosure and agree to the <a href="#">Terms of Service</a></span>
            </label>

            <button type="submit" class="submit-btn" id="submitBtn">
                <span>Open trading account</a></span>
            </button>
        </form>

        <div class="form-footer">
            Already verified? <a href="/login">Sign In</a>
        </div>
    </div>

    <script src="/signup.js"></script>
</body>
</html>
